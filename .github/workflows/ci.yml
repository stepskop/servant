name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make -j"$(nproc)" CXX=${{ matrix.cxx }}

      - name: Reject a start with no config argument
        run: |
          if ./webserv; then
            echo "expected a usage error when no config file is given"
            exit 1
          fi

      - name: NO_COLOR strips the ANSI escapes
        run: |
          out=$(NO_COLOR=1 ./webserv 2>&1 || true)
          case "$out" in
            *$'\033'*) echo "NO_COLOR was ignored: $out"; exit 1 ;;
          esac

      - name: Serve a request and shut down on SIGTERM
        run: |
          # The example config, not default.conf: the latter serves
          # /var/www/html, which only exists inside the image.
          ./webserv example/servant.conf &
          pid=$!

          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

          # The server must exit on its own; a hang here means the signal
          # handling that lets `docker stop` work has regressed.
          kill -TERM "$pid"
          for _ in $(seq 1 50); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "still running 5s after SIGTERM"
            kill -9 "$pid"
            exit 1
          fi

  image:
    name: image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: Dockerfile
          - variant: alpine
            dockerfile: Dockerfile.alpine
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: servant:ci-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Runs as an unprivileged user
        run: |
          uid=$(docker run --rm --entrypoint id servant:ci-${{ matrix.variant }} -u)
          if [ "$uid" != "10001" ]; then
            echo "expected uid 10001, got $uid"
            exit 1
          fi

      - name: Serves the default site
        run: |
          docker run -d --name servant-ci -p 8080:8080 servant:ci-${{ matrix.variant }}

          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q servant
          curl -fsS http://127.0.0.1:8080/style.css >/dev/null
          curl -fsS http://127.0.0.1:8080/assets/ascii-art.txt >/dev/null

          # The custom 404 the default config points at must actually ship;
          # the built-in fallback page does not carry this text.
          curl -s http://127.0.0.1:8080/nope | grep -q "wandered off"

      - name: Stops promptly on SIGTERM
        run: |
          start=$(date +%s)
          docker stop -t 10 servant-ci
          elapsed=$(( $(date +%s) - start ))
          # `docker stop` waits out the full timeout before resorting to
          # SIGKILL, so a slow stop means the SIGTERM handler never ran.
          if [ "$elapsed" -ge 5 ]; then
            echo "took ${elapsed}s to stop; SIGTERM was not handled"
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs servant-ci || true

  example:
    name: example image
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Rebuilt from cache rather than carried between jobs, so the example is
      # checked against this commit's base image instead of a published tag.
      - name: Base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: servant:ci-debian
          cache-from: type=gha,scope=debian

      - name: Build the example on top of it
        run: |
          docker build \
            --build-arg BASE=servant:ci-debian \
            -t servant-example:ci \
            example

      - name: Every feature the example config claims
        run: |
          docker run -d --name example-ci -p 8080:8080 servant-example:ci

          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break
            sleep 0.2
          done

          curl -fsS http://127.0.0.1:8080/ | grep -q servant
          curl -s  http://127.0.0.1:8080/nope | grep -q "wandered off"

          # 301 redirect.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/old)
          [ "$code" = "301" ] || { echo "/old returned $code"; exit 1; }

          # CGI through the python3 the example installs.
          curl -fsS http://127.0.0.1:8080/scripts/script.py | grep -q "Hello from CGI"

          # Upload, then read it back from the autoindexed location.
          curl -fsS -X POST --data-binary 'ci' http://127.0.0.1:8080/uploads/ci.txt >/dev/null
          curl -fsS http://127.0.0.1:8080/uploads/ci.txt | grep -q ci

      - name: Container logs
        if: always()
        run: docker logs example-ci || true
