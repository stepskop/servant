name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: publish (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: Dockerfile
            suffix: ''
          - variant: alpine
            dockerfile: Dockerfile.alpine
            suffix: '-alpine'
    steps:
      - uses: actions/checkout@v4

      # Docker Hub is optional: without the secrets the release still goes out
      # to GHCR rather than failing.
      - name: Detect Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=docker.io/$DOCKERHUB_USERNAME/servant" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME is unset; publishing to GHCR only."
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, 1, latest  (alpine: same, each -alpine suffixed).
      # A prerelease tag such as v1.2.3-rc1 only ever gets its exact version.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.hub.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.suffix }}
            type=semver,pattern={{major}}${{ matrix.suffix }}
            type=raw,value=latest,enable=${{ matrix.variant == 'debian' && !contains(github.ref_name, '-') }}
            type=raw,value=alpine,enable=${{ matrix.variant == 'alpine' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.variant }}

  release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

          # Prepend the pull instructions to the auto-generated changelog.
          gh release view "$TAG" --json body -q .body > generated.md
          version="${TAG#v}"
          {
            printf '## Images\n\n'
            printf '```sh\n'
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              printf 'docker pull %s/servant:%s\n' "$DOCKERHUB_USERNAME" "$version"
              printf 'docker pull %s/servant:%s-alpine\n' "$DOCKERHUB_USERNAME" "$version"
            fi
            printf 'docker pull ghcr.io/%s:%s\n' "$REPO" "$version"
            printf 'docker pull ghcr.io/%s:%s-alpine\n' "$REPO" "$version"
            printf '```\n\n'
            printf 'Linux amd64 and arm64.\n\n'
            cat generated.md
          } > notes.md

          gh release edit "$TAG" --notes-file notes.md
