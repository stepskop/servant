# Default config — nginx-lite grammar.
#
# Exercises every feature of the server: virtual hosts, per-location roots, aliases and
# limits, allowed methods, autoindex, redirects, uploads and CGI.

# Primary virtual host on an unprivileged port.
server {
    listen 0.0.0.0:8080;
    server_name localhost servant.local;

    root ./www;
    index index.html;
    client_max_body_size 1m;            # size suffixes k/m/g are supported

    error_page 404 /errors/404.html;

    location / {
        methods GET DELETE;
        autoindex off;
    }

    location /uploads {
        methods GET POST DELETE;
        root ./www;
        autoindex on;
        upload_store ./www/uploads;  # per-location override
        client_max_body_size 10m;   # per-location override
    }

    location /old {
        return 301 /;                   # permanent redirect to /
    }

    location /scripts {
        methods GET POST;
        # alias remaps the matched prefix instead of appending like root:
        # /scripts/script.py  ->  ./www/cgi-bin/script.py
        alias ./www/cgi-bin;
        cgi .py /usr/bin/python3;       # run *.py through python3
    }
}

