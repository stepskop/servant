# Default config — serves a static site over GET, nothing else.
#
# This is what the Docker image installs as /etc/servant/servant.conf, so
# overwriting that one path in your own image replaces this file wholesale.
# See example/servant.conf for a config that exercises every feature: virtual hosts,
# aliases, autoindex, redirects, uploads and CGI.

server {
    # 0.0.0.0, not 127.0.0.1: a published container port arrives on the
    # container's own interface, so a loopback-bound socket is unreachable.
    # 8080 because the runtime user is not root and cannot bind below 1024.
    listen 0.0.0.0:8080;
    server_name localhost;

    root /var/www/html;
    index index.html;
    client_max_body_size 1m;            # size suffixes k/m/g are supported

    error_page 404 /errors/404.html;

    location / {
        methods GET;
        autoindex off;
    }
}
